<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interstellar Expansion Percolation Model</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --input-bg: #0d1117;
    }

    html, body {
      height: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* -- Left panel -- */
    .sidebar {
      width: 340px;
      min-width: 300px;
      max-width: 400px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px;
      gap: 20px;
    }

    h1 {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--accent);
    }

    h2 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 0.82rem;
    }

    label span {
      color: var(--muted);
      font-size: 0.75rem;
    }

    input[type="number"] {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 6px 8px;
      font-size: 0.85rem;
      width: 100%;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      margin: 4px 0;
    }

    .checkbox-row input {
      width: auto;
      accent-color: var(--accent);
    }

    .preset-btn {
      width: 100%;
      margin-top: 8px;
    }

    .param-section-note {
      font-size: 0.72rem;
      color: var(--muted);
      margin: 8px 0 4px;
      font-style: italic;
    }

    .strict-bounded-panel {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin: 10px 0 4px;
      background: rgba(88, 166, 255, 0.05);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .strict-bounded-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.84rem;
      font-weight: 600;
    }

    .strict-bounded-status.active {
      color: #3ddc60;
    }

    .strict-bounded-status.inactive {
      color: var(--muted);
    }

    .strict-bounded-params {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    button {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #238636;
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) { background: #2ea043; }

    .btn-secondary {
      background: #21262d;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) { background: #30363d; }

    .btn-danger {
      background: #6e1314;
      color: #fff;
      border: 1px solid #b62324;
    }

    .btn-danger:hover:not(:disabled) { background: #8a1f1f; }

    /* -- Readout -- */
    .readout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
    }

    .stat .value {
      font-size: 1.35rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .stat .value.sm {
      font-size: 0.88rem;
      font-weight: 600;
    }

    .stat .value.xs {
      font-size: 0.78rem;
      font-weight: 500;
      line-height: 1.35;
    }

    .stat .label {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .help-btn {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 0.65rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }

    .help-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(88, 166, 255, 0.1);
    }

    label .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    canvas {
      cursor: crosshair;
    }

    .stat.wide { grid-column: 1 / -1; }

    /* -- Legend -- */
    .legend {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
    }

    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* -- Canvas area -- */
    .canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #010409;
      position: relative;
      overflow: hidden;
      padding: 12px;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 1px solid var(--border);
      border-radius: 4px;
      max-width: 100%;
      max-height: 100%;
    }

    .grid-size-control {
      margin-top: 4px;
    }

    /* -- Rules dialog -- */
    .rules-dialog {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0;
      max-width: 520px;
      width: calc(100% - 32px);
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
      position: fixed;
      margin: 0;
      inset: auto;
    }

    .rules-dialog::backdrop {
      background: rgba(0, 0, 0, 0.65);
    }

    .rules-dialog header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }

    .rules-dialog h3 {
      font-size: 1rem;
      color: var(--accent);
    }

    .rules-dialog .close-btn {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 6px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1;
    }

    .rules-dialog .close-btn:hover { background: #21262d; color: var(--text); }

    .rules-body {
      padding: 16px 18px 18px;
      font-size: 0.82rem;
      line-height: 1.55;
      max-height: 70vh;
      overflow-y: auto;
    }

    .rules-body h4 {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 14px 0 6px;
    }

    .rules-body h4:first-child { margin-top: 0; }

    .rules-body ul {
      padding-left: 1.2em;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .rules-body p { margin-top: 8px; color: var(--muted); font-size: 0.78rem; }

    .help-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      margin-left: 4px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 0.65rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      vertical-align: middle;
      flex: 0 0 auto;
    }

    .help-btn:hover { border-color: var(--accent); color: var(--accent); }

    .stat .label {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 2px;
    }

    .node-dialog .node-meta {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 12px;
      margin-bottom: 12px;
      font-size: 0.8rem;
    }

    .node-dialog .node-meta dt { color: var(--muted); }
    .node-dialog .node-meta dd { margin: 0; }

    .node-history {
      font-size: 0.78rem;
      line-height: 1.45;
      max-height: 40vh;
      overflow-y: auto;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    .node-history li { margin-bottom: 4px; }

    .canvas-wrap canvas { cursor: crosshair; }

    /* -- Main stage (grid + legend) -- */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: #010409;
    }

    .stage-layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) min(200px, 26%);
      grid-template-rows: 1fr auto;
      gap: 12px;
      padding: 12px;
      min-height: 0;
    }

    .stage-layout .canvas-wrap {
      grid-column: 1;
      grid-row: 1 / -1;
      flex: unset;
      min-height: 0;
    }

    .stage-aside {
      grid-column: 2;
      grid-row: 2;
      align-self: start;
      max-height: 100%;
      overflow-y: auto;
    }

    .legend-block h2 {
      margin-bottom: 8px;
    }

    /* -- Mobile run chrome (hidden on desktop) -- */
    .mobile-only {
      display: none;
    }

    .run-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      padding-top: max(10px, env(safe-area-inset-top));
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    .run-header .run-year {
      font-size: 1.1rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .run-header .btn-danger {
      flex: 0 0 auto;
      min-width: 7rem;
      padding: 8px 14px;
    }

    .run-status-banner {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #3d2a00;
      background: rgba(210, 153, 34, 0.12);
      font-size: 0.82rem;
    }

    .run-status-banner[hidden] {
      display: none !important;
    }

    .run-status-banner .btn-danger {
      flex: 0 0 auto;
      padding: 6px 12px;
      font-size: 0.8rem;
      margin-left: auto;
    }

    .mobile-footer {
      flex-shrink: 0;
      flex-direction: column;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }

    .mobile-time-bar {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px 12px 0;
    }

    .mobile-time-bar .btn-row button {
      font-size: 0.8rem;
      padding: 10px 8px;
    }

    .view-switcher {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }

    .view-switcher button {
      flex: 1;
    }

    .view-switcher button[aria-current="page"] {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(88, 166, 255, 0.08);
    }

    @media (max-width: 768px) {
      html, body {
        overflow: hidden;
        height: 100%;
        height: 100dvh;
      }

      .app {
        flex-direction: column;
        height: 100dvh;
        width: 100%;
      }

      .mobile-only {
        display: flex;
      }

      .mobile-footer {
        display: flex;
      }

      .sidebar-time-actions {
        display: none;
      }

      .sidebar {
        width: 100%;
        max-width: none;
        min-width: 0;
        flex: 1;
        min-height: 0;
        border-right: none;
        border-bottom: none;
      }

      .app[data-view="run"] .sidebar {
        display: none;
      }

      .app[data-view="setup"] .stage {
        display: none;
      }

      .stage {
        flex: 1;
        min-height: 0;
      }

      .stage-layout {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) auto;
        padding: 8px;
      }

      .stage-layout .canvas-wrap {
        grid-column: 1;
        grid-row: 1;
      }

      .stage-aside {
        grid-column: 1;
        grid-row: 2;
        max-height: none;
      }

      .legend-block .legend {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 8px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="app" data-view="setup">
    <aside class="sidebar">
      <h1>Interstellar Expansion<br>Percolation Model</h1>
      <button class="btn-secondary" id="btnRules" type="button" style="width:100%">Simulation Rules</button>
      <button class="btn-secondary preset-btn" id="btnPreset" type="button">Bounded Expansion Preset</button>
      <button class="btn-secondary preset-btn" id="btnHartTipler" type="button">Hart-Tipler (Unconstrained) Preset</button>

      <div class="run-status-banner" id="runStatusBanner" hidden>
        <span>Simulation running — year <strong id="runStatusYear">0</strong></span>
      </div>

      <section>
        <h2>Parameters</h2>
        <div class="control-group" id="controls"></div>
      </section>

      <section>
        <h2>Time Control</h2>
        <div class="control-group">
          <label>
            Time Jump (x1,000 years)
            <input type="number" id="timeJump" value="100" min="1" max="100000" step="1">
          </label>
          <div class="btn-row sidebar-time-actions">
            <button class="btn-primary js-btn-advance" id="btnAdvance" type="button">Advance 100k yr</button>
            <button class="btn-secondary" id="btnNextEvent" type="button">Forward to Next Event</button>
          </div>
          <div class="btn-row sidebar-time-actions">
            <button class="btn-danger" id="btnStop" type="button" disabled>Stop Forward</button>
            <button class="btn-secondary" id="btnReset" type="button">Reset Simulation</button>
          </div>
          <label class="checkbox-row">
            <input type="checkbox" id="chkProfiling">
            Enable profiling
            <button class="btn-secondary" id="btnViewProfiling" type="button" style="flex:0 0 auto; padding:6px 8px; font-size:0.78rem; margin-left:auto;">View</button>
          </label>
          <div class="btn-row">
            <button class="btn-secondary" id="btnResetProfiling" type="button">Reset Profiling</button>
          </div>
        </div>
      </section>

      <section>
        <h2>Data Readout</h2>
        <div class="readout" id="readout"></div>
      </section>
    </aside>

    <main class="stage">
      <div class="run-header mobile-only" id="runHeader">
        <span class="run-year" id="runHeaderYear">Year 0</span>
      </div>
      <div class="stage-layout">
        <div class="canvas-wrap">
          <canvas id="grid"></canvas>
        </div>
        <aside class="stage-aside">
          <section class="legend-block">
            <h2>Legend</h2>
            <div class="legend" id="legend"></div>
          </section>
        </aside>
      </div>
    </main>

    <footer class="mobile-footer mobile-only">
      <div class="mobile-time-bar">
        <div class="btn-row">
          <button class="btn-primary js-btn-advance" id="btnAdvanceMobile" type="button">Advance 100k yr</button>
          <button class="btn-secondary" id="btnNextEventMobile" type="button">Forward to Next Event</button>
        </div>
        <div class="btn-row">
          <button class="btn-danger" id="btnStopMobile" type="button" disabled>Stop Forward</button>
          <button class="btn-secondary" id="btnResetMobile" type="button">Reset Simulation</button>
        </div>
      </div>
      <nav class="view-switcher" aria-label="View">
        <button class="btn-secondary js-view-setup" id="btnViewSetup" type="button" aria-current="page">Setup</button>
        <button class="btn-secondary js-view-run" id="btnViewRun" type="button">Live grid</button>
      </nav>
    </footer>
  </div>

  <dialog class="rules-dialog" id="rulesDialog">
    <header>
      <h3>Simulation Rules</h3>
      <button class="close-btn" id="btnCloseRules" type="button" aria-label="Close">&times;</button>
    </header>
    <div class="rules-body" id="rulesContent"></div>
  </dialog>

  <dialog class="rules-dialog" id="helpDialog">
    <header>
      <h3 id="helpDialogTitle">Help</h3>
      <button class="close-btn" id="btnCloseHelp" type="button" aria-label="Close">&times;</button>
    </header>
    <div class="rules-body" id="helpDialogContent"></div>
  </dialog>

  <dialog class="rules-dialog node-dialog" id="nodeDialog">
    <header>
      <h3 id="nodeDialogTitle">Cell Details</h3>
      <button class="close-btn" id="btnCloseNode" type="button" aria-label="Close">&times;</button>
    </header>
    <div class="rules-body" id="nodeDialogContent"></div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
