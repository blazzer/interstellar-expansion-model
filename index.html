<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interstellar Expansion Percolation Model</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --input-bg: #0d1117;
    }

    html, body {
      height: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* -- Left panel -- */
    .sidebar {
      width: 340px;
      min-width: 300px;
      max-width: 400px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px;
      gap: 20px;
    }

    h1 {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--accent);
    }

    h2 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 0.82rem;
    }

    label span {
      color: var(--muted);
      font-size: 0.75rem;
    }

    input[type="number"] {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 6px 8px;
      font-size: 0.85rem;
      width: 100%;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      margin: 4px 0;
    }

    .checkbox-row input {
      width: auto;
      accent-color: var(--accent);
    }

    .preset-btn {
      width: 100%;
      margin-top: 8px;
    }

    .param-section-note {
      font-size: 0.72rem;
      color: var(--muted);
      margin: 8px 0 4px;
      font-style: italic;
    }

    .strict-bounded-panel {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin: 10px 0 4px;
      background: rgba(88, 166, 255, 0.05);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .strict-bounded-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.84rem;
      font-weight: 600;
    }

    .strict-bounded-status.active {
      color: #3ddc60;
    }

    .strict-bounded-status.inactive {
      color: var(--muted);
    }

    .strict-bounded-params {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    button {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #238636;
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) { background: #2ea043; }

    .btn-secondary {
      background: #21262d;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) { background: #30363d; }

    .btn-danger {
      background: #6e1314;
      color: #fff;
      border: 1px solid #b62324;
    }

    .btn-danger:hover:not(:disabled) { background: #8a1f1f; }

    /* -- Readout -- */
    .readout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
    }

    .stat .value {
      font-size: 1.35rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .stat .value.sm {
      font-size: 0.88rem;
      font-weight: 600;
    }

    .stat .value.xs {
      font-size: 0.78rem;
      font-weight: 500;
      line-height: 1.35;
    }

    .stat .label {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .help-btn {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 0.65rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }

    .help-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(88, 166, 255, 0.1);
    }

    label .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    canvas {
      cursor: crosshair;
    }

    .stat.wide { grid-column: 1 / -1; }

    /* -- Legend -- */
    .legend {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
    }

    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* -- Canvas area -- */
    .canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #010409;
      position: relative;
      overflow: hidden;
      padding: 12px;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 1px solid var(--border);
      border-radius: 4px;
      max-width: 100%;
      max-height: 100%;
    }

    .grid-size-control {
      margin-top: 4px;
    }

    /* -- Rules dialog -- */
    .rules-dialog {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0;
      max-width: 520px;
      width: calc(100% - 32px);
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
      position: fixed;
      margin: 0;
      inset: auto;
    }

    .rules-dialog::backdrop {
      background: rgba(0, 0, 0, 0.65);
    }

    .rules-dialog header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }

    .rules-dialog h3 {
      font-size: 1rem;
      color: var(--accent);
    }

    .rules-dialog .close-btn {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 6px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1;
    }

    .rules-dialog .close-btn:hover { background: #21262d; color: var(--text); }

    .rules-body {
      padding: 16px 18px 18px;
      font-size: 0.82rem;
      line-height: 1.55;
      max-height: 70vh;
      overflow-y: auto;
    }

    .rules-body h4 {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 14px 0 6px;
    }

    .rules-body h4:first-child { margin-top: 0; }

    .rules-body ul {
      padding-left: 1.2em;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .rules-body p { margin-top: 8px; color: var(--muted); font-size: 0.78rem; }

    .help-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      margin-left: 4px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 0.65rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      vertical-align: middle;
      flex: 0 0 auto;
    }

    .help-btn:hover { border-color: var(--accent); color: var(--accent); }

    .stat .label {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 2px;
    }

    .node-dialog .node-meta {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 12px;
      margin-bottom: 12px;
      font-size: 0.8rem;
    }

    .node-dialog .node-meta dt { color: var(--muted); }
    .node-dialog .node-meta dd { margin: 0; }

    .node-history {
      font-size: 0.78rem;
      line-height: 1.45;
      max-height: 40vh;
      overflow-y: auto;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    .node-history li { margin-bottom: 4px; }

    .canvas-wrap canvas { cursor: crosshair; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>Interstellar Expansion<br>Percolation Model</h1>
      <button class="btn-secondary" id="btnRules" type="button" style="width:100%">Simulation Rules</button>
      <button class="btn-secondary preset-btn" id="btnPreset" type="button">Bounded Expansion Preset</button>
      <button class="btn-secondary preset-btn" id="btnHartTipler" type="button">Hart-Tipler (Unconstrained) Preset</button>

      <section>
        <h2>Parameters</h2>
        <div class="control-group" id="controls"></div>
      </section>

      <section>
        <h2>Time Control</h2>
        <div class="control-group">
          <label>
            Time Jump (x1,000 years)
            <input type="number" id="timeJump" value="100" min="1" max="100000" step="1">
          </label>
          <div class="btn-row">
            <button class="btn-primary" id="btnAdvance">Advance Time</button>
            <button class="btn-secondary" id="btnNextEvent">Forward to Next Event</button>
          </div>
          <div class="btn-row">
            <button class="btn-danger" id="btnStop" disabled>Stop Forward</button>
            <button class="btn-secondary" id="btnReset">Reset Simulation</button>
          </div>
          <label class="checkbox-row">
            <input type="checkbox" id="chkProfiling">
            Enable profiling
            <button class="btn-secondary" id="btnViewProfiling" type="button" style="flex:0 0 auto; padding:6px 8px; font-size:0.78rem; margin-left:auto;">View</button>
          </label>
          <div class="btn-row">
            <button class="btn-secondary" id="btnResetProfiling" type="button">Reset Profiling</button>
          </div>
        </div>
      </section>

      <section>
        <h2>Data Readout</h2>
        <div class="readout" id="readout"></div>
      </section>

      <section>
        <h2>Legend</h2>
        <div class="legend" id="legend"></div>
      </section>
    </aside>

    <main class="canvas-wrap">
      <canvas id="grid"></canvas>
    </main>
  </div>

  <dialog class="rules-dialog" id="rulesDialog">
    <header>
      <h3>Simulation Rules</h3>
      <button class="close-btn" id="btnCloseRules" type="button" aria-label="Close">&times;</button>
    </header>
    <div class="rules-body" id="rulesContent"></div>
  </dialog>

  <dialog class="rules-dialog" id="helpDialog">
    <header>
      <h3 id="helpDialogTitle">Help</h3>
      <button class="close-btn" id="btnCloseHelp" type="button" aria-label="Close">&times;</button>
    </header>
    <div class="rules-body" id="helpDialogContent"></div>
  </dialog>

  <dialog class="rules-dialog node-dialog" id="nodeDialog">
    <header>
      <h3 id="nodeDialogTitle">Cell Details</h3>
      <button class="close-btn" id="btnCloseNode" type="button" aria-label="Close">&times;</button>
    </header>
    <div class="rules-body" id="nodeDialogContent"></div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
